name: Monthly maintenance checklist

# Opens a GitHub issue on the 1st of each month listing that month's by-hand
# work (the calendar is in scripts/monthly_checklist.py). GitHub emails the
# repository owner about new issues. Run it by hand with "dry run" to preview
# a month's checklist in the run summary without opening an issue.
on:
  schedule:
    - cron: "0 13 1 * *"   # the 1st of each month, 13:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "Month number (1-12); blank for the current month"
        required: false
      dry_run:
        description: "Preview only; do not open an issue"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build this month's checklist
        run: |
          python scripts/monthly_checklist.py ${{ inputs.month }} > checklist.md
          head -n 1 checklist.md > title.txt
          tail -n +3 checklist.md > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open the issue
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat title.txt)" --body-file body.md
